<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DeAI · Painel de Processamento</title>
  <meta name="description" content="Remoção de metadados e de-fingerprinting de imagens de IA em lote.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #07070d; font-family: system-ui, -apple-system, sans-serif; }
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(1000px 700px at 30% -15%, rgba(139, 92, 246, 0.38), transparent 60%), #07070d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e7e7f0;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #a78bfa;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .setup-banner {
      display: none;
      max-width: 600px;
      padding: 24px;
      background: rgba(20, 20, 34, 0.85);
      border: 1px solid rgba(167, 139, 250, 0.3);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      text-align: center;
      line-height: 1.6;
    }
    .setup-banner h2 { margin-bottom: 12px; color: #fff; }
    .setup-banner code { background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 6px; color: #22d3ee; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <p>Carregando painel DeAI...</p>
    <div class="setup-banner" id="banner">
      <h2>Configure seu App Streamlit</h2>
      <p>Publique seu repositório no <strong>Streamlit Cloud</strong> e altere a variável <code>STREAMLIT_APP_URL</code> no arquivo <code>public/index.html</code> para o seu link (ex: <code>https://seu-app.streamlit.app</code>).</p>
    </div>
  </div>

  <script>
    // Cole aqui o link gerado pelo Streamlit Cloud após publicar:
    const STREAMLIT_APP_URL = "https://share.streamlit.io"; // Altere para a URL pública do seu app

    const frame = document.createElement("iframe");
    frame.id = "app-frame";
    frame.allow = "camera; microphone; clipboard-read; clipboard-write;";
    frame.src = STREAMLIT_APP_URL;

    frame.onload = () => {
      const loader = document.getElementById("loading");
      if (loader) {
        loader.style.opacity = "0";
        setTimeout(() => loader.style.display = "none", 400);
      }
    };

    if (STREAMLIT_APP_URL === "https://share.streamlit.io") {
      setTimeout(() => {
        const banner = document.getElementById("banner");
        if (banner) banner.style.display = "block";
      }, 2000);
    }

    document.body.appendChild(frame);
  </script>
</body>
</html>
